name: Deploy TopoScript Language Reference

on:
  push:
    branches:
      - main
    paths:
      - "docs/topo-script-reference/**"
      - ".github/workflows/toposcript-reference-pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Rebuild documentation search index
        run: node docs/topo-script-reference/tools/build-search-index.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload TopoScript reference
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/topo-script-reference

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
