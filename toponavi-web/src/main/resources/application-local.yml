# Local development against a PostgreSQL server on this machine. Persisted projects always live in PostgreSQL;
# there is no in-memory database or source-directory fallback. Supply TOPONAVI_SERVICE_TOKEN in the environment.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/toponavi}
    username: ${SPRING_DATASOURCE_USERNAME:toponavi}
    password: ${SPRING_DATASOURCE_PASSWORD:toponavi}
