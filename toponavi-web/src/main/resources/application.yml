spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/toponavi}
    username: ${SPRING_DATASOURCE_USERNAME:toponavi}
    password: ${SPRING_DATASOURCE_PASSWORD:yourpassword}
    driver-class-name: org.postgresql.Driver
  flyway:
    # Flyway creates and owns only the project-store schema and its history table. Legacy platform tables in
    # other schemas are never migrated, baselined, altered, or cleaned.
    schemas: toponavi_projects
    default-schema: toponavi_projects
    create-schemas: true
    baseline-on-migrate: false
    clean-disabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 64

platform:
  security:
    # Required opaque service Bearer credential (at least 32 characters). There is no default: startup fails
    # without it. Never commit the value or put it in a URL.
    service-token: ${TOPONAVI_SERVICE_TOKEN:}
  projects:
    max-files: 512
    max-source-bytes: 4194304     # Sum of UTF-8 source bytes per stored project.
    max-request-bytes: 33554432   # Decoded project create/replace request body.
    lock-timeout-ms: 5000
  api:
    allow-cors: ${TOPONAVI_ALLOW_CORS:false}
    anonymous-buildings: ${TOPONAVI_ANONYMOUS_BUILDINGS:}
    cors:
      allowed-origins: ${TOPONAVI_CORS_ALLOWED_ORIGINS:}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: Content-Type,Authorization
      allow-credentials: ${TOPONAVI_CORS_ALLOW_CREDENTIALS:false}
    filter:
      max-depth: 16
      max-predicates: 256
      max-path-length: 1024
      max-literal-bytes: 16384
      max-membership: 256
    authoring:
      allow-guests: ${TOPONAVI_ALLOW_GUEST_AUTHORING:false}
      # Separate from platform.projects.max-source-bytes. If the two diverge, a stored project may exceed the
      # request-supplied validation limit.
      max-files: 512
      max-source-bytes: 4194304
      max-concurrent-compilations: 2

server:
  port: 8080
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 200
      min-spare: 10
