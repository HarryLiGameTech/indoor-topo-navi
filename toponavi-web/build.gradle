plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.11' // Use latest stable
    id 'io.spring.dependency-management' version '1.1.6'
}

repositories {
    mavenCentral()
}

sourceSets {
    // PostgreSQL-backed tests. They require Docker (Testcontainers) and fail, rather than skip, without it.
    integrationTest {
        java.srcDir 'src/integrationTest/java'
        resources.srcDir 'src/integrationTest/resources'
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Project store schema migrations (version managed by Spring Boot; PostgreSQL support is built into Flyway 9).
    implementation 'org.flywaydb:flyway-core'

    // PostgreSQL driver
    runtimeOnly 'org.postgresql:postgresql'

    // Jackson (already transitively included, but explicit for clarity)
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    implementation project(':toponavi-dsl') // Depend on your DSL compiler
    implementation project(':toponavi-core') // Depend on core data structures

    // Scala library is needed at runtime since the dependency is in Scala
    implementation 'org.scala-lang:scala3-library_3:3.3.4'

    testImplementation platform('org.junit:junit-bom:5.11.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    integrationTestImplementation 'org.testcontainers:postgresql'
    integrationTestImplementation 'org.testcontainers:junit-jupiter'
}

test {
    useJUnitPlatform()
}

tasks.register('integrationTest', Test) {
    description = 'Runs PostgreSQL integration tests (requires Docker).'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
    // The Boot-managed Testcontainers (1.19.x) defaults to a Docker API version that Docker Engine 29+ rejects.
    // 1.44 is supported by Docker Engine 25 and newer; override with -PdockerApiVersion=... if needed.
    systemProperty 'api.version', project.findProperty('dockerApiVersion') ?: '1.44'
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}
